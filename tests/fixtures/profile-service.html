<!doctype html>
<meta charset="utf-8">
<title>Profile service harness</title>
<p>Engines of one profile: a profile service and content engines joined to it by links. Driven by tests/profile-service.spec.mjs.</p>
<script type="module">
  import { EngineRuntime } from '../../host/runtime.js';
  import { ProfileService } from '../../host/profile-service.js';
  import { probeOpfs } from '../../host/opfs.js';

  const engineUrl = new URL('../../engine/inception-engine.js', import.meta.url).href;
  const params = new URLSearchParams(location.search);
  const relayUrl = params.get('relay') ?? `ws://${location.hostname}:5001/`;
  const contents = [];
  let service = null;
  const services = [];
  const serviceEvents = [];
  let requests = 0;

  const once = (target, name, timeout = 30000) => new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(`no ${name} in ${timeout} ms`)), timeout);
    target.addEventListener(name, (e) => {
      clearTimeout(timer);
      resolve(e.detail);
    }, { once: true });
  });

  // `role`: 'content', or 'standalone' for an engine with its own network and
  // an ephemeral profile, to compare with.
  async function startContent(role = 'content') {
    const runtime = new EngineRuntime({ engineUrl, role: role === 'content' ? 'content' : 'standalone' });
    await runtime.start();
    const ready = once(runtime, 'ready');
    runtime.send('init', { ...(role === 'content' ? { role } : { profile: `standalone-${Date.now()}`, freshProfile: true, opfs: await probeOpfs() }), width: 320, height: 240, deviceScaleFactor: 1, gpu: false, url: '', debug: true, wispUrl: relayUrl });
    const detail = await ready;
    const entry = { runtime, link: null, ready: detail, crashed: null };
    runtime.addEventListener('crash', (e) => (entry.crashed = e.detail));
    contents.push(entry);
    return contents.length - 1;
  }

  function connect(index) {
    const entry = contents[index];
    entry.link = service.connect(entry.runtime, { onClosed: (reason) => (entry.closedReason = reason) });
    return entry.link;
  }

  async function ping(index, { bytes = 16, sync = false } = {}) {
    const runtime = contents[index].runtime;
    const id = ++requests;
    const result = new Promise((resolve) => {
      const listener = (e) => {
        if (e.detail.id !== id) return;
        runtime.removeEventListener('debug.link.result', listener);
        resolve(e.detail);
      };
      runtime.addEventListener('debug.link.result', listener);
    });
    runtime.send('debug.link', { id, bytes, sync });
    return result;
  }

  async function evaluate(index, source) {
    const runtime = contents[index].runtime;
    const id = ++requests;
    const result = new Promise((resolve) => {
      const listener = (e) => {
        if (e.detail.id !== id) return;
        runtime.removeEventListener('debug.result', listener);
        resolve(e.detail.value);
      };
      runtime.addEventListener('debug.result', listener);
    });
    runtime.send('debug.evaluate', { id, source });
    return result;
  }

  window.harness = {
    async startService(options = {}) {
      service = ProfileService.acquire({ engineUrl, relayUrl, profile: `service-test-${Date.now()}`, fresh: true, debug: true, ...options });
      const info = await service.start();
      service.addEventListener('engineevent', (e) => serviceEvents.push(e.detail));
      service.addEventListener('restart', () => (window.harness.restarted = (window.harness.restarted ?? 0) + 1));
      return { role: info.role, persistent: info.persistent, features: service.runtime.features };
    },
    startContent,
    connect,
    ping,
    evaluate,
    content: (index) => ({ link: contents[index].link, ready: contents[index].ready, crashed: contents[index].crashed, closedReason: contents[index].closedReason ?? null }),
    crashService() {
      service.runtime.send('debug.crash');
      return once(service, 'crash').then(() => true);
    },
    crashContent(index) {
      const entry = contents[index];
      entry.runtime.send('debug.crash');
      return once(entry.runtime, 'crash').then(() => {
        service.disconnect(entry.link);
        entry.runtime.terminate();
        return true;
      });
    },
    waitRestart: () => once(service, 'restart', 60000),
    // Loads `url` in content engine `index` and waits until `ready` (script)
    // is true there.
    // `ready` defaults to: the page at `url` finished loading.
    async navigate(index, url, ready = null, timeout = 60000) {
      ready ??= `location.href === ${JSON.stringify(url)} && document.readyState === "complete"`;
      await evaluate(index, 'window.__previous = true; 1');
      contents[index].runtime.send('load', { url });
      const until = performance.now() + timeout;
      while (performance.now() < until) {
        await new Promise((resolve) => setTimeout(resolve, 250));
        if ((await evaluate(index, `!window.__previous && (${ready})`)) === 'true') return evaluate(index, 'location.href');
      }
      throw new Error(`${url} did not load in ${timeout} ms`);
    },
    events: (index, name) => {
      const list = [];
      contents[index].runtime.addEventListener(name, (e) => list.push(e.detail));
      return list;
    },
    serviceSend: (command, args) => service.send(command, args),
    runtimeOf: (index) => contents[index].runtime,
    // Another service in this document (another profile, or an ephemeral one).
    async startProfile(options) {
      const other = ProfileService.acquire({ engineUrl, relayUrl, debug: true, ...options });
      await other.start();
      services.push(other);
      return other;
    },
    connectTo(other, index) {
      contents[index].link = other.connect(contents[index].runtime);
      return contents[index].link;
    },
    // Every event the service engine reports, by name, since startService.
    serviceEvents: (name) => serviceEvents.filter((e) => e.name === name).map((e) => e.data),
    // How many times the document fetched the engine's code and image.
    fetches: () => performance.getEntriesByType('resource').filter((e) => /inception-engine\.(wasm|data)$/.test(e.name)).map((e) => e.name.split('/').pop()),
    stop() {
      service?.stop();
      for (const other of services) other.stop();
      for (const entry of contents) entry.runtime.terminate();
    },
  };
  window.dispatchEvent(new Event('harnessready'));
  document.title = 'ready';
</script>
