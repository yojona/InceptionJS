# Unit tests, the package's tests and the type check, on every push and pull
# request. They need no engine files; the browser suite runs in e2e.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Host unit tests
        run: node --test tests/unit/*.test.mjs
      - name: Package tests (relay, tokens, policy, Vite plugin)
        run: npm test -w inceptionjs
      - name: Type check
        run: npm run typecheck --if-present
