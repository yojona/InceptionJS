<svg xmlns="http://www.w3.org/2000/svg" width="310" height="64" viewBox="0 0 310 64" role="img" aria-label="InceptionJS">
  <style>
    .word { fill: #11131a; font: 760 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1.2px; }
    @media (prefers-color-scheme: dark) { .word { fill: #f1f2f6; } }
  </style>
  <defs>
    <linearGradient id="js" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#a36bff"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#6d5efc"/>
  <rect x="18" y="18" width="28" height="28" rx="7" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="76" y="46" class="word">Inception<tspan fill="url(#js)">JS</tspan></text>
</svg>
